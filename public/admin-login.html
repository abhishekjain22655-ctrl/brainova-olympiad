<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Brainova National Olympiad</title>
  
  <link rel="shortcut icon" type="image/png" href="/public/assets/media/logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0b0726 0%, #19124d 50%, #0d0933 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand img {
      width: 72px;
      height: auto;
      margin-bottom: 12px;
    }
    .login-brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .badge-admin {
      display: inline-block;
      background: rgba(241, 96, 50, 0.18);
      color: #f16032;
      border: 1px solid rgba(241, 96, 50, 0.35);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i.icon-prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.95rem;
    }
    .form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 14px 12px 40px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #f16032;
      box-shadow: 0 0 0 3px rgba(241, 96, 50, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }
    .btn-submit {
      width: 100%;
      background: #f16032;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: #e04f21;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(241, 96, 50, 0.35);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 0.82rem;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-home:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-brand">
      <img src="/public/assets/media/logo.png" alt="Brainova Logo">
      <h1>Brainova National Olympiad</h1>
      <p>Institutional Master Control Panel</p>
      <span class="badge-admin"><i class="fa-solid fa-shield-halved me-1"></i> Admin Authorization</span>
    </div>

    <div class="alert-error" id="errorMessage"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail">Administrator Username / Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user-shield icon-prefix"></i>
          <input type="text" id="adminEmail" class="form-control" placeholder="admin@brainova.com" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword">Master Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock icon-prefix"></i>
          <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <a href="/" class="back-home"><i class="fa-solid fa-arrow-left me-1"></i> Return to Public Website</a>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const errBox = document.getElementById('errorMessage');
    const btn = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const username = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/admin';
        } else {
          errBox.textContent = data.message || 'Invalid administrator credentials.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard';
        }
      } catch (err) {
        errBox.textContent = 'Server communication error. Please try again.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard';
      }
    });
  </script>

</body>
</html>
